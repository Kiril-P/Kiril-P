name: stats

# Redraw assets/stats.svg from the public contribution calendar once a day.
on:
  schedule:
    - cron: "17 5 * * *"        # 05:17 UTC daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [assets/stats.py, .github/workflows/stats.yml]

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw
        run: python3 assets/stats.py > stats.tmp && mv stats.tmp assets/stats.svg
      - name: Commit if changed
        run: |
          git diff --quiet assets/stats.svg && { echo "no change"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git commit -m "stats: $(date -u +%F)"
          git push
