<style>
:root{--bg:#fbfaf7;--line:#d0d7de;--ink:#9a6700;--hot:#d1530f;--dim:#6e7781;--text:#24292f;--grid:#d0d7de}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--line:#30363d;--ink:#f2cc60;--hot:#ff8a4c;--dim:#8b949e;--text:#e6edf3;--grid:#30363d}}
